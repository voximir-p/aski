name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:

permissions:
  contents: read

jobs:
  windows-arm-release:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Windows ARM64 target
        run: rustup target add aarch64-pc-windows-msvc
      - name: Build Windows ARM64 release binary
        run: cargo build --locked --profile dist --target aarch64-pc-windows-msvc
      - name: Check Windows ARM64 binary
        run: ./target/aarch64-pc-windows-msvc/dist/aski.exe --version

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Check documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test video decoding and cancellation
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: cargo test --locked --test cli --test url -- --include-ignored
      - name: Test terminal resize and restoration
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: |
          cargo build --locked
          python3 tests/terminal_smoke.py target/debug/aski
