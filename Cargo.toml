[package]
name = "aski"
version = "2.1.0"
edition = "2024"
repository = "https://github.com/voximir-p/aski"

[package.metadata.wix]
upgrade-guid = "FF0806DC-77E8-40B0-B7A4-0B91859C20DF"
path-guid = "088C4DEA-7015-4094-9D8D-754003B2CD33"
license = false
eula = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ctrlc = "3.5"
image = "0.25"
itoa = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tempfile = "3.27"
terminal_size = "0.4"
tokio = { version = "1.53", features = ["rt", "time", "macros"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[[bench]]
name = "render"
harness = false
